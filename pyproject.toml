[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rintag"
version = "0.1.0"
description = "A Python-based POS tagger for the Rinconada Bikol Language using CRF"
readme = "docs/pypi/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vince Clifford C. Aguilar"},
    {name = "Nhel Adam S. Benosa"},
    {name = "Elyssa Olivares"},
]
keywords = [
    "nlp",
    "pos-tagging",
    "rinconada-bikol",
    "bikol",
    "crf",
    "low-resource-nlp",
    "computational-linguistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Other",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "sklearn-crfsuite>=0.3.6",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pandas>=1.5",
    "numpy>=1.21",
    "matplotlib",
    "seaborn",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/<GITHUB_OWNER>/<RINTAG_REPO>"
Repository = "https://github.com/<GITHUB_OWNER>/<RINTAG_REPO>"
Issues = "https://github.com/<GITHUB_OWNER>/<RINTAG_REPO>/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rintag = ["models/*.pkl"]
