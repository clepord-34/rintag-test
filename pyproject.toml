[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rintag"
version = "0.1.0"
description = "A Python-based POS tagger for the Rinconada Bikol Language using CRF"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vince Clifford C. Aguilar"},
    {name = "Nhel Adam S. Benosa"},
    {name = "Elyssa Olivares"},
]
dependencies = [
    "sklearn-crfsuite>=0.3.6",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pandas>=1.5",
    "numpy>=1.21",
    "matplotlib",
    "seaborn",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rintag = ["models/*.pkl"]
